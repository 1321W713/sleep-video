<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>还不睡？</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0d0d;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        /* ---- 提问界面 ---- */
        .interaction-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0d0d0d 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .interaction-layer.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        h1 {
            color: #fff;
            font-size: 2.5rem;
            font-weight: 600;
            margin: 0 0 2.5rem 0;
            letter-spacing: 2px;
            text-align: center;
            padding: 0 20px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            background: #7c5cfc;
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(124, 92, 252, 0.3);
            min-width: 160px;
            text-align: center;
        }

        .btn:hover {
            background: #6a4de6;
            transform: scale(1.04);
        }

        .btn.secondary {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: none;
            backdrop-filter: blur(5px);
        }

        .btn.secondary:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ---- “晚了”提示层 ---- */
        .late-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .late-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .late-text {
            font-size: 6rem;
            font-weight: 700;
            color: #ffb3b3;
            text-shadow: 0 0 20px rgba(255, 100, 100, 0.6);
            animation: fadeInScale 0.5s ease;
        }

        @keyframes fadeInScale {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ---- 视频播放器 ---- */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        video {
            max-width: 100%;
            max-height: 100vh;
            outline: none;
        }
    </style>
</head>
<body>
    <!-- 交互层 -->
    <div class="interaction-layer" id="interactionLayer">
        <h1>这么晚还不睡觉？</h1>
        <div class="buttons">
            <button class="btn" id="btnSleep">现在睡了</button>
            <button class="btn secondary" id="btnAwake">我就不睡</button>
        </div>
    </div>

    <!-- “晚了”浮层 -->
    <div class="late-overlay" id="lateOverlay">
        <span class="late-text">晚了</span>
    </div>

    <!-- 视频播放区 -->
    <div class="video-container" id="videoContainer">
        <video id="myVideo" src="soothe.mp4" controls playsinline></video>
    </div>

    <script>
        const interactionLayer = document.getElementById('interactionLayer');
        const btnSleep = document.getElementById('btnSleep');
        const btnAwake = document.getElementById('btnAwake');
        const lateOverlay = document.getElementById('lateOverlay');
        const videoContainer = document.getElementById('videoContainer');
        const video = document.getElementById('myVideo');

        // 公共函数：开始播放
        function playVideo() {
            interactionLayer.classList.add('hidden');
            videoContainer.style.display = 'flex';
            video.play().catch(() => {
                // 万一自动播放被阻，用户可手动点控件
            });
        }

        // 现在睡了
        btnSleep.addEventListener('click', () => {
            // 1. 隐藏交互层
            interactionLayer.classList.add('hidden');
            // 2. 显示“晚了”
            lateOverlay.classList.add('show');
            // 3. 1.2秒后关闭浮层并播放视频
            setTimeout(() => {
                lateOverlay.classList.remove('show');
                playVideo();
            }, 1200);
        });

        // 我就不睡
        btnAwake.addEventListener('click', () => {
            playVideo();
        });

        // 点击视频可暂停/播放
        video.addEventListener('click', () => {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>助眠视频</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0d0d;
        }

        /* ---- 引导封面 ---- */
        .cover {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0d0d0d 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .cover.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .cover .icon {
            font-size: 4rem;
            margin-bottom: 0.5rem;
        }

        .cover h1 {
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
            letter-spacing: 2px;
        }

        .cover p {
            color: #a0a0b0;
            font-size: 1.1rem;
            margin: 0 0 2rem 0;
        }

        .play-btn {
            background: #7c5cfc;
            color: white;
            border: none;
            padding: 16px 48px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 15px rgba(124, 92, 252, 0.4);
        }

        .play-btn:hover {
            background: #6a4de6;
            transform: scale(1.04);
        }

        .play-btn:active {
            transform: scale(0.97);
        }

        /* ---- 视频播放器容器 ---- */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;   /* 初始隐藏 */
            justify-content: center;
            align-items: center;
            background: #000;
        }

        video {
            max-width: 100%;
            max-height: 100vh;
            outline: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <!-- 引导封面 -->
    <div class="cover" id="cover">
        <div class="icon">🌙</div>
        <h1>助眠视频</h1>
        <p>静下心来，准备进入放松时刻</p>
        <button class="play-btn" id="playButton">开始播放</button>
    </div>

    <!-- 视频播放器（点击按钮后才显示） -->
    <div class="video-container" id="videoContainer">
        <video id="myVideo" src="soothe.mp4" controls playsinline></video>
    </div>

    <script>
        const cover = document.getElementById('cover');
        const playBtn = document.getElementById('playButton');
        const videoContainer = document.getElementById('videoContainer');
        const video = document.getElementById('myVideo');

        playBtn.addEventListener('click', () => {
            // 隐藏封面
            cover.classList.add('hidden');
            // 显示视频
            videoContainer.style.display = 'flex';
            // 尝试自动播放（因为是由用户点击触发，大概率成功）
            video.play().catch(err => {
                console.log('自动播放未成功，请手动点击播放按钮', err);
            });
        });

        // 点击视频区域也可以开始/暂停（可选体验）
        video.addEventListener('click', () => {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        });
    </script>
</body>
</html>
